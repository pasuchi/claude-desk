name: Compilar app para Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar version portable (Apple Silicon e Intel)
        run: |
          npx electron-builder --mac zip --arm64 --x64 --publish never
          mv dist/Claude-Desk-portable-arm64.zip "dist/Claude-Desk-portable-AppleSilicon.zip"
          mv dist/Claude-Desk-portable-x64.zip "dist/Claude-Desk-portable-Intel.zip"

      - name: Comprobar firma
        run: |
          cd dist && ditto -x -k Claude-Desk-portable-AppleSilicon.zip check
          codesign --verify --deep --strict --verbose=2 "check/Claude Desk.app"
          rm -rf check

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/Claude-Desk-portable-*.zip \
            --title "Claude Desk $TAG" \
            --notes "Version portable: descarga el zip de tu Mac (AppleSilicon = chip M1-M4, Intel = procesador Intel), descomprimelo y abre Claude Desk con doble clic. No hace falta instalar."
